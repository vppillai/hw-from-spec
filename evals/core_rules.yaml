# evals/core_rules.yaml — the core rules that must stay in the references, and the folklore that must stay out.
# Read by scripts/rule_check.py (eval 19 and the smoke run every group). An every_sentence entry lists each sentence of its section
# verbatim: a deleted, reworded or added sentence goes red, so an edit of that section is also an edit of this file. Refresh a list
# with `scripts/rule_check.py --sentences FILE SECTION` after a reviewed change, never to make a red check green unread.
# `--mutate` deletes each sentence, flips one verdict word per sentence and inserts each banned phrase, one at a time.
measurement:
- file: references/software-track.md
  section: '## 23. '
  heading: '## 23. A measurement checks its own counters: the norm, never a mode'
  every_sentence: true
  must:
  - A pattern test gives a verdict only from counters it has checked.
  - The rules below hold for any error counter on any link.
  - Counter checks are part of every measurement.
  - No flag or mode turns them off.
  - No name such as "high fidelity" sets them apart.
  - The knobs are the window length and the gate mode.
  - Keep the raw reads of every window.
  - A read holds the monotonic time, the error and opportunity counters, the reported ratio and the lock flags.
  - It also holds the temperature of both ends.
  - 'Record the event unit of each error counter: bit, symbol, block or codeword.'
  - Record its opportunity counter in the same unit.
  - 'A bit error counter gives a BER: bit errors over bits.'
  - Other units give an error ratio over symbols, blocks or codewords.
  - Compare a ratio only with a limit in the same unit.
  - Convert between units only by a stated model.
  - Record when each counter counts.
  - Some count only while the checker holds lock, or only inside a gate.
  - Unknown counting semantics make the window INCONCLUSIVE.
  - 'Record the counting point of each counter: before or after the FEC, and before or after a gearbox.'
  - Key each limit to that point.
  - A post-FEC count of zero does not prove the pre-FEC margin.
  - A release record with a post-FEC limit also needs a measured pre-FEC limit.
  - No waiver replaces it.
  - Without a measured pre-FEC margin, the record says "pre-FEC margin not verified".
  - That lane cannot PASS into a release record.
  - Use the rate at which the counter increments, in its own unit.
  - Read it from the standard's table for the active configuration and that counting point.
  - Apply an encoding or FEC factor only as the standard defines it there.
  - For example, one 100G PAM4 lane runs at 53.125 GBd, which is 106.25 Gb/s.
  - An unknown rate or unit makes the window INCONCLUSIVE.
  - Never divide an aggregate rate by the other side's lane count.
  - Each window has its own baseline and its own time.
  - T is the time the counters counted, from the window's verified baseline to its closing read.
  - For a counter that counts only while locked or gated, T is that counted time.
  - The window's deltas and its T cover the same interval.
  - Sum the windows' deltas once each, never a cumulative read twice.
  - Verify a reset in four steps.
  - Stop or gate the counting.
  - Reset.
  - Wait the documented update time, and drop every read taken before it.
  - Then read a fresh baseline.
  - A fresh baseline is consistent with the time since the reset.
  - The opportunity count is at most the rate × the elapsed time, with the slack.
  - The error count is zero, or the errors of that time are explained.
  - Any other baseline means the reset failed, and the epoch is invalid.
  - The opportunity counter grows at the documented opportunity rate × T.
  - Allow the clock tolerance and the read timing slack over T.
  - Any other growth law is a counter fault, and the window is INCONCLUSIVE with that reason.
  - Test the expected linear law, not one named alternative.
  - 'Dated example (2026-10): one module''s opportunity (bit) counter grew as rate × T² / 2.'
  - An epoch ends at every documented clearing event.
  - 'List them from the datasheet: a reset command, a clear-on-read, an enable change, a firmware restart.'
  - Lock loss, a watchdog, a gate expiry, low power and an application change can clear too.
  - Prove that the epoch continues before any modulo step.
  - The proof covers every listed clearing event, and an unchanged uptime or restart count.
  - Without that proof, a fall of either counter invalidates the window.
  - Treat each counter on its own.
  - Know each counter's width, and whether it wraps or saturates.
  - Cap every window, whatever the ratio of the window before.
  - The cap is (modulus / 2) / (rate × BER_max).
  - The modulus, the rate and BER_max share the counter's event unit.
  - BER_max is the highest error ratio the counter can see while it counts.
  - When it is not proven, take the unit's maximum, 1.
  - Also cap the window so that the opportunity counter cannot pass half its own modulus.
  - 'Example: a 32-bit bit error counter on a 106.25 Gb/s lane.'
  - Its cap is about 20 ms at BER_max 1.
  - A proven BER_max of 1e-3 gives about 20 s.
  - The first window uses the cap.
  - Inside the cap, a shorter window is always allowed.
  - A window longer than its cap is invalid, the read skew included.
  - When one read cycle over every lane takes longer than the cap, the run is INCONCLUSIVE.
  - The exception is counters that are frozen or latched together.
  - Inside the cap, a fall in a continuing epoch is exactly one wrap.
  - Unwrap it and count the window.
  - A step of half the modulus or more invalidates the window.
  - A read at the saturation value makes that window and every later window of the epoch INCONCLUSIVE.
  - A new verified reset starts a new epoch.
  - A lower bound on the errors comes only from a proven saturation or a proven wrap.
  - A saturated count is a lower bound.
  - A fall in a continuing epoch outside the cap proves at least one wrap.
  - Then the delta plus one modulus is a lower bound.
  - An unexplained step, reset or corrupt read gives no bound; the window is INCONCLUSIVE.
  - Apply the Poisson lower limit to a lower-bound count over its opportunities.
  - A lower Poisson limit over the criteria limit is a FAIL.
  - That FAIL wins over the INCONCLUSIVE of the invalid window.
  - 'Compute the ratio two ways: errors over the rate × T, and errors over the opportunity counter.'
  - Compare both with the reported ratio.
  - With no reported ratio, compare the two computed values with each other.
  - The criteria state the tolerance before the run.
  - Derive it from the counter resolution and the read skew.
  - A dated tool used a factor of 1.5; that is a ceiling, not a default.
  - A mismatch beyond the tolerance makes the window INCONCLUSIVE.
  - Compare on a frozen read or an atomic latch.
  - Without one, timestamp each field read.
  - Bound the total skew of all the fields, and add it to the slack.
  - A module that reports a ratio only cannot pass this check.
  - A deaf checker reads zero errors on any link.
  - Challenge the checker on every judged lane and direction before a PASS that can enter a release record.
  - Run the challenge in the same session and configuration as the run, in its own epoch.
  - Keep its errors out of the run totals.
  - Repeat it after any firmware, application or pattern change.
  - A challenge passes only when the error counter rises while lock holds.
  - With injected errors, the counter rises by the injected count within the stated tolerance.
  - A challenge that ends in lock loss alone proves the lock detector, not the counter.
  - 'Anchor the challenge to a known physical lane: its connector pins, or a lane-unique pattern on that lane.'
  - Check that only the expected counter rises and every other counter stays unchanged.
  - That proves the counter's lane map.
  - Prefer an error-injection command.
  - A pattern mismatch, an inverted polarity or a known-bad cable counts only when the counter rises while lock holds.
  - Record the challenge with the run.
  - A lane with no passed challenge reads "checker unproven".
  - An unproven lane is INCONCLUSIVE in the run verdict.
  - It cannot enter a release record.
  - Keep the live lock state and the latched lock loss apart.
  - OR a clear-on-read flag over every read of the window.
  - A lock loss after the settling is verdict-bearing.
  - The criteria say whether it fails the lane or makes it INCONCLUSIVE; it is never dropped.
  - The errors and opportunities of a window with a lock loss stay out of the run totals.
  - The start-up settling is a contiguous prefix of windows from the release, fixed before the run.
  - The criteria give its rule and its maximum time.
  - 'The rule uses only observable state: the lock, the data path state, a stable read of the lock flags.'
  - It never uses the ratios of later windows.
  - Never move the settling point after you see the data.
  - Settling past the maximum makes the run INCONCLUSIVE.
  - 'Judge the start-up on its own, against start-up limits in the criteria: its time, its errors and its lock losses.'
  - Judge the windows after it as the steady state, a later burst included.
  - The verdict says whether it covers the steady state, the start-up or both.
  - The first windows after a release can read worse.
  - Call the cause lock-in only when a control proves it.
  - A window is invalid when the rate is unknown or the growth law fails.
  - It is invalid when a counter falls with no proof of a continuing epoch.
  - It is invalid on a step of half the modulus, a saturation or a window longer than its cap.
  - It is invalid when the ratios disagree or the gate does not complete.
  - It is invalid when the settling passes its maximum or the counting semantics are unknown.
  - An invalid window makes the run INCONCLUSIVE, unless a lower bound proves a FAIL.
  - The verdict of a lane and direction uses its run total.
  - A run total is the errors over the opportunities, each summed over the counted windows.
  - Never average window ratios.
  - Never average lanes.
  - Never judge the last window alone.
  - Keep enough counted windows to apply the settling rule and the dispersion check.
  - The run passes only when every required lane and direction passes.
  - Any FAIL fails the run.
  - Otherwise the run is INCONCLUSIVE.
  - Judge each run total by its one-sided Poisson limits at a stated level CL, per lane and direction.
  - Let χ²(p; ν) be the p-quantile of the chi-square law with ν degrees of freedom.
  - For k errors in N opportunities, the upper limit is χ²(CL; 2k + 2) / (2N).
  - The lower limit is χ²(1 − CL; 2k) / (2N), and 0 when k is 0.
  - PASS needs the upper limit under the criteria limit.
  - FAIL needs the lower limit over the criteria limit.
  - Otherwise the lane is INCONCLUSIVE.
  - With zero errors the upper limit is −ln(1 − CL) / N, about 3 / N at 95 %.
  - Set the minimum opportunity count from the limit, about 3 / limit at 95 %.
  - Many lanes at one CL raise the chance of a wrong verdict somewhere.
  - The criteria state the level per lane.
  - 'One way is the Šidák rule: CL_lane = CL_run^(1/m) for m lanes and directions.'
  - The Poisson limits assume independent errors.
  - Clustered errors make the lane INCONCLUSIVE.
  - The exception is a dispersion test that the criteria predeclare.
  - 'Example: a chi-square test of the window counts against their opportunity-weighted Poisson expectation.'
  - Separate the lock-in from a temperature effect.
  - Log the temperature per window.
  - Claim a warm-up effect only when the ratio tracks the temperature after the settling windows are excluded.
  - Test each unit as a sender and as a receiver.
  - One module sent clean and received at 1e-4 on all lanes.
  - Only a swap of the far unit showed which side failed.
  - Rule out one cause per run.
  - 'Write each one down: temperature, supply, tool, method, unit, cable direction.'
  - The list keeps the hunt short and a vendor question factual.
  - Number every unit before a multi-unit session, on the unit and in the record.
  - Four modules moved between three unmarked cases in one evening, and only the identity read told them apart.
  - Check the record name before the power goes up.
  - Refuse a record name that exists.
  - Open the record for exclusive create.
  - Write the identity first.
  - Check the record path and every permission flag of the run before the power goes up.
  - A run that fails at its record after the power-up leaves a hot unit and no record.
  - A command that writes its record and then re-raises needs one handler at the command dispatch.
  - A handler per command misses the next command.
  never:
  - A disabled lane stops at one bit
  - Use windows of 5 s or more
  - Judge warm
  - cold first seconds
  - Cold 120 s runs
  - and with rate × T² / 2, and record the model that fits
  - host interface rate over the media lane count
  - ask the vendor about the unit
  - Let the link settle
  - The verdict counts every window after the settling time
  - where the hardware allows
  - take 0.5 when it is unknown
  - the median of the later windows
- file: references/software-track.md
  section: '## 20. '
  heading: '## 20. Pattern tests between two ends'
  every_sentence: true
  must:
  - The checker's lock-loss flag latches from the moment the checker is enabled.
  - Read it once after the far generator is up.
  - Then reset the counters, verify the reset by a read-back, and open the gate (§23).
  - 'A long pattern function hides three reusable steps: arm, end-of-gate statistics, disable.'
  - Arm is the setup and the clearing of the latched flags; the settling is judged inside the run (§23).
  - Read back the pattern, the polarity and the enable at both ends before the gate.
  - Pull the three steps out.
  - A per-second trend and a far-end loopback then cost one loop each.
  - A module's opportunity counter may not grow at the lane rate.
  - Check its growth law in every window before you trust a rate from it (§23).
  - A far-end loopback carries the pattern while the checker reports lock loss for the whole gate and still counts.
  - Judge a loopback run on a per-second lock view, never on the end flag alone.
  - A link reads worse in its first seconds.
  - One per-second rate fell tenfold inside a minute.
  - A control is needed before you call that lock-in.
  - Apply the predeclared settling rule and report the settling (§23).
  - Say which fibre or cable set the floor; the wrong fibre type still links.
  - Judge each lane against the expected enable map and the documented counter semantics.
  - A disabled lane's opportunity delta stays near zero when its counter stops while disabled.
  - An enabled lane's opportunity delta matches the documented opportunity rate × the counted time (§23).
  - 'Judge on the counters: the latched lock-loss byte flickers on a marginal fibre in any short window.'
  - A host-side loop also acts as a far-end loopback.
  - A module in mission mode returns its media input through the loop to its media output.
  - The record names the topology.
  - A host-loop result is not a media-link result.
  - A host-side generator points at the host, not at the cable.
  - On a two-cage board with the host lanes cross-connected it drives the other end's host input, and the far media-side checker measures the whole path with no host present.
  - Use the module's gating timers for the window.
  - Record the actual gate start and end.
  - A gate that does not complete makes the window INCONCLUSIVE.
  - Read the error counters beside the derived rate.
- file: references/software-track.md
  section: '## 19. '
  heading: '## 19. The register map as data'
  every_sentence: true
  must:
  - A tester that reads only the bytes its tests need grows a pile of constants with holes.
  - An audit read 7 of 18 page families and the page showed about 25 fields of 300.
  - 'Write one data table per page: byte, bits, kind, unit, the revision that defines it, the advertisement bit that gates it.'
  - One decode loop then covers every page, and an unread block says "not advertised".
  - Gate a decode on the revision byte AND the advertisement bit.
  - A module of an older revision advertises a page in that older layout.
  - Say "not in this revision" and keep the raw bytes, so a reader sees why the page is empty.
  - The lower page is its own buffer.
  - An index of `byte - 128` into the upper page reads garbage without an error.
  - Page checksums are plain sums modulo 256 over the standard's byte ranges.
  - A fake module needs them set, or every audit fails.
  - The flag bytes latch at power-up and clear on read.
  - A pin sense before any register read shows the interrupt line low on every fresh insert.
  - Read the flag bytes first, name the bits, then sense the pins.
  - '"Interrupt pending" is true only when the line stays low after that read.'
  - The page says "interrupt latched since insert, read the cable to clear it".
  - A module does not power up in its first application, and the staged application is not the active one.
  - Read the active application before you trust a lane count.
  - A narrow application needs one data path per lane group, with the data path id as the lowest lane of its group; one id on all lanes is rejected.
  - An active cable waits in its init state until a host-side signal arrives.
  - On a tester with no host lanes the media flags read zero and prove nothing.
  - Read the data path state before you trust a media flag.
  - 'The lever is the host signal: a cross-connect between two cages on one board gives one end the other end''s generator output, and the module leaves its init state.'
  - An advertisement bit says a register exists, not that it works.
  - 'A feature matrix finds the hollow ones in low power: a write, a read-back and a restore per advertised row, or a read per monitor.'
  - 'The hollow ones seen: a user page that ignores writes, monitors that read a constant, descriptor pages that read zero.'
  - The passport flags a hollow feature; it never lists the bit as a feature.
  - An advertised duration is a ceiling the host waits for, not a measurement.
  - One module answered ten times faster than its bound.
  - A module may answer a feature query with "command unknown" and still run the commands of that family.
  - '"Unknown" reads as "not advertised", never as a failure, and the exercise decides.'
  - A latched flag latches again while its condition holds.
  - A loss-of-signal flag pulled the interrupt line low right after the read, because the far transmitter was still off.
  - Read the line a second time after the undo.
  - A success status on a write is not proof that the setting applied.
  - One module answered "success" for every staged setting and kept its active set unchanged.
  - Read back the active set.
  - Then read the configuration status and the data path state.
  - A low-power pin is not a hardware guard when a register can override it.
  - Any bus master can write the override.
  - Only the rail switch with verified isolation is an absolute stop.
  - Check that no signal line back-powers the rail (§18).
  - Leaving low power does not always bring the data path up.
  - The result depends on the data path controls and the standard's state machine.
  - Read the data path state; never assume it.
  - A deactivated data path leaves the receive monitors blank.
  - Read those monitors inside a pattern run or a trend run.
  - A firmware update can rotate the application table.
  - One update moved the one-lane application to the first slot and made the eight-lane one the second.
  - 'Select an application by its whole descriptor: the host and media interface codes and the lane counts.'
  - Never select it by its number.
  - Key the criteria on the firmware version.
  - A firmware update on a two-ended cable is two updates.
  - Each end carries its own image banks, and the serial is shared.
  - The tool updates one end per insertion; the kit text says "swap the ends and repeat".
- file: references/software-track.md
  section: '## 22. '
  heading: '## 22. The browser page over the bench tool'
  every_sentence: true
  must:
  - A browser page is cheap when the tool has quiet functions with a `say` callback.
  - Run the function in a thread, push every line to a queue, stream the queue as server-sent events.
  - The live chart parses the same line the terminal prints, so the records stay one truth.
  - The technician's `ask` becomes a blocking question the browser answers.
  - The server carries an instance id on its heartbeat.
  - The page treats a changed id as a restart and reloads every cached value.
  - Without it an old tab shows yesterday's readings with today's clock.
  - 'Design the screens from the questions a user brings: which cable is this, is it healthy, run the test.'
  - A first page built from the command line's shape shows raw JSON under empty panels.
  - Name the tabs by task, never by skill level.
  - Keep the raw record behind a toggle, and every table goes through one label module with formatters, checked by a script run in the selftest.
  - A technician page never asks for a switch the product ships preset.
  - The first real run read the engineering checklist as instructions, and the operator moved switches the design hides on purpose.
  - Read the state from the pins, show a pre-check card, and ask only for the one fix.
  - The strap and forced-air lines stay in the engineering path.
  - A form that sends an empty string for an unscanned field turns a missing value into a mismatch.
  - Normalise at the engine boundary, never in the judge.
  - One early stop leaves one line, not one per unmeasured key.
  - A long step with no visible motion reads as a hung tool.
  - Show the step name, what it does, a timer against the expected duration and the last lines the engine printed, from the first event of the step.
  - The run streams every event; keep them by step from the first line.
  - Every step is then a door to its results, live and on a saved record.
  - Each tab owns its result area, so a query result never follows the user to the next tab.
  - A pin badge must know what a read does to the pin (§19).
  - A clock chip shows the clock in use; the ramp detail goes to a bubble.
  - Every string the page shows follows the writing standard, with a lint over the page's text sources in the selftest and the record round.
  - 'Help bubbles come from one glossary source, and the help page is task-first: a short how-to per tab, the long text behind a toggle, a troubleshooting table.'
  - Check a page round on the real units from its worktree before the merge.
  - The real pair exposed a pins-low badge, a reset budget field, a stacked chart and an undefined stop reason that the fake never showed.
  - Measure overflow in the browser, element edge against card edge, never by eye.
  - A header cell styled `nowrap` with a 1% width is right for a key column and wrong for a six-column table.
  - A second front end on the same server costs one handler subclass and a static fallback directory.
  - The unit lock, the job stream, the heartbeat and the record index stay in one module.
  - 'A criteria file derived from one dump guesses two things a run contradicts: the data path state with no host (§19) and the thermal slope in the first minute, which is the step response.'
  - Derive the no-host expectation and a slope limit from the thermal fit, judged after the first minute.
  - A proposed file gives inconclusive, never a fail bin; the owner confirms it by writing a name into it.
  - Key the match on the firmware version.
  - 'A record index keyed on identity needs a kind rule decided by the records that carry the evidence: a record that states the media technology sets the kind, a record without one never does.'
  - A flow written for two ends hides literal end names in prompts, loops and the judge; grep for them before the first one-end run.
  - A browser's private-network rule changes by version and by the page's origin.
  - Name the browser, its version and the test date with each claim.
  - Test each browser the users run.
  - A provisioning protocol over a radio link can send the network password in clear.
  - Protect it by an authenticated, encrypted session.
  - A wired serial link reduces the exposure; it does not replace the encryption.
