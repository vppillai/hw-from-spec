# evals/core_rules.yaml — the core rules that must stay in the references, and the folklore that must stay out.
# Read by scripts/rule_check.py (eval 19 and the smoke run every group). An every_sentence entry lists each sentence of its section
# verbatim: a deleted, reworded or added sentence goes red, so an edit of that section is also an edit of this file. Refresh a list
# with `scripts/rule_check.py --sentences FILE SECTION` after a reviewed change, never to make a red check green unread.
# `--mutate` deletes each sentence, flips one verdict word per sentence and inserts each banned phrase, one at a time.
measurement:
- file: references/software-track.md
  section: '## 23. '
  heading: '## 23. A measurement checks its own counters: the norm, never a mode'
  every_sentence: true
  must:
  - A pattern test gives a verdict only from counters it has checked.
  - The rules below hold for any error counter on any link.
  - Counter checks are part of every measurement.
  - No flag or mode turns them off.
  - No name such as "high fidelity" sets them apart.
  - The knobs are the window length and the gate mode.
  - Keep the raw reads of every window.
  - A read holds the monotonic time, the error and opportunity counters, the reported ratio and the lock flags.
  - It also holds the temperature of both ends.
  - 'Record the event unit of each error counter: bit, symbol, block or codeword.'
  - Record its opportunity counter in the same unit.
  - 'A bit error counter gives a BER: bit errors over bits.'
  - Other units give an error ratio over symbols, blocks or codewords.
  - Compare a ratio only with a limit in the same unit.
  - Convert between units only by a stated model.
  - Record when each counter counts.
  - Some count only while the checker holds lock, or only inside a gate.
  - Unknown counting semantics make the window INCONCLUSIVE.
  - 'Record the counting point of each counter: before or after the FEC, and before or after a gearbox.'
  - Key each limit to that point.
  - A post-FEC count of zero does not prove the pre-FEC margin.
  - A release with only a post-FEC limit also needs a pre-FEC limit.
  - The other way is an owner waiver row that says why.
  - Take the lane rate at the counting point, in the counter's unit.
  - Read it from the standard's table for the active configuration.
  - Include the encoding and FEC overhead that the counting point sees.
  - For example, one 100G PAM4 lane runs at 53.125 GBd, which is 106.25 Gb/s.
  - A lane rate the tool cannot look up makes the window INCONCLUSIVE.
  - Never divide an aggregate rate by the other side's lane count.
  - Each window has its own baseline and its own time.
  - Reset the counters, or take a baseline read, at the window start.
  - T is the time from that verified reset or baseline to the window's closing read.
  - The window's deltas and its T cover the same interval.
  - Sum the windows' deltas once each, never a cumulative read twice.
  - Verify a reset by a read-back of at most one count, or the datasheet's sticky maximum.
  - A larger read-back means the reset failed, and the epoch is invalid.
  - 'Skip the reads of the first update interval after a reset: they can hold the old count.'
  - The opportunity counter grows at the documented opportunity rate × the time it counted.
  - Allow the clock tolerance and the read timing slack over T.
  - Any other growth law is a counter fault, and the window is INCONCLUSIVE with that reason.
  - Test the expected linear law, not one named alternative.
  - 'Dated example (2026-10): one module''s opportunity (bit) counter grew as rate × T² / 2.'
  - Tell a wrap from a reset, a read-clear, a re-enable and a firmware restart.
  - Prove the epoch continues before any modulo step.
  - 'The proof: no reset command, no clear-on-read, no enable change, and an unchanged uptime or restart count.'
  - Without that proof, a fall of either counter invalidates the window.
  - Treat each counter on its own.
  - Know each counter's width, and whether it wraps or saturates.
  - Cap every window, whatever the ratio of the window before.
  - The cap is (modulus / 2) / (rate × BER_max).
  - The modulus, the rate and BER_max share the counter's event unit.
  - BER_max is the highest error ratio the counter can see while it counts.
  - When it is not documented, take the unit's maximum, 1.
  - Also cap the window so that the opportunity counter cannot pass half its own modulus.
  - 'Example: a 32-bit bit error counter on a 106.25 Gb/s lane.'
  - Its cap is about 20 ms at BER_max 1.
  - A documented BER_max of 1e-3 gives about 20 s.
  - The first window uses the cap.
  - Inside the cap, a shorter window is always allowed.
  - Inside the cap, a fall in a continuing epoch is exactly one wrap.
  - Unwrap it and count the window.
  - A step of half the modulus or more invalidates the window.
  - A read at the saturation value makes that window and every later window of the epoch INCONCLUSIVE.
  - A new verified reset starts a new epoch.
  - The saturated count is a lower bound on the errors.
  - A saturation, or a window that a step invalidated, gives a lower bound on the errors.
  - A lower-bound ratio over the limit is a FAIL.
  - That FAIL wins over the INCONCLUSIVE of the invalid window.
  - 'Compute the ratio two ways: errors over the rate × T, and errors over the opportunity counter.'
  - Compare both with the reported ratio.
  - With no reported ratio, compare the two computed values with each other.
  - The criteria state the tolerance before the run.
  - Derive it from the counter resolution and the read skew.
  - A dated tool used a factor of 1.5; that is a ceiling, not a default.
  - A mismatch beyond the tolerance makes the window INCONCLUSIVE.
  - A computed lower bound over the limit is a FAIL even when the reported ratio agrees.
  - Compare on a frozen read or an atomic latch.
  - Without one, timestamp each field read.
  - Bound the total skew of all the fields, and add it to the slack.
  - A module that reports a ratio only cannot pass this check.
  - A deaf checker reads zero errors on any link.
  - Challenge the checker on every judged lane and direction before a result enters a release record.
  - A challenge passes only when that lane's error counter rises while lock holds.
  - With injected errors, the counter rises by the injected count within the stated tolerance.
  - A challenge that ends in lock loss alone proves the lock detector, not the counter.
  - A rise on the expected lane and direction also proves that counter's lane map.
  - Prefer an error-injection command.
  - A pattern mismatch, an inverted polarity or a known-bad cable counts only when the counter rises while lock holds.
  - Record the challenge with the run.
  - A lane with no passed challenge reads "checker unproven".
  - An unproven lane cannot enter a release record.
  - Keep the live lock state and the latched lock loss apart.
  - OR a clear-on-read flag over every read of the window.
  - A lock loss after the settling is verdict-bearing.
  - The criteria say whether it fails the lane or makes it INCONCLUSIVE; it is never dropped.
  - The errors and opportunities of a window with a lock loss stay out of the run totals.
  - The start-up settling is a contiguous prefix of windows from the release, fixed before the run.
  - The criteria give its rule and its maximum time.
  - 'The rule uses only observable state: the lock, the data path state, a stable read of the lock flags.'
  - It never uses the ratios of later windows.
  - Exclude the settling windows from the verdict.
  - Report them, with the time to the end of the settling per direction.
  - Never move the settling point after you see the data.
  - Every window after the settling counts, a later burst too.
  - Settling past the maximum makes the run INCONCLUSIVE.
  - The first windows after a release can read worse.
  - Call the cause lock-in only when a control proves it.
  - A window is invalid when the lane rate is unknown or the growth law fails.
  - It is invalid when a counter falls with no proof of a wrap.
  - It is invalid on a step of half the modulus or a saturation.
  - It is invalid when the ratios disagree or the gate does not complete.
  - It is invalid when the settling passes its maximum or the counting semantics are unknown.
  - An invalid window makes the run INCONCLUSIVE, unless a lower bound proves a FAIL.
  - The verdict of a lane and direction uses its run total.
  - A run total is the errors over the opportunities, each summed over the counted windows.
  - Never average window ratios.
  - Never average lanes.
  - Never judge the last window alone.
  - Keep enough counted windows to apply the settling rule and the burst check.
  - The run passes only when every required lane and direction passes.
  - Any FAIL fails the run.
  - Otherwise the run is INCONCLUSIVE.
  - Judge each run total by its Poisson confidence bounds at a stated level CL, per lane and direction.
  - Let χ²(p; ν) be the p-quantile of the chi-square law with ν degrees of freedom.
  - For k errors in N opportunities, the upper bound is χ²(CL; 2k + 2) / (2N).
  - The lower bound is χ²(1 − CL; 2k) / (2N), and 0 when k is 0.
  - PASS needs the upper bound under the limit.
  - FAIL needs the lower bound over the limit.
  - Otherwise the lane is INCONCLUSIVE.
  - With zero errors the upper bound is −ln(1 − CL) / N, about 3 / N at 95 %.
  - Set the minimum opportunity count from the limit, about 3 / limit at 95 %.
  - Many lanes at one CL raise the chance of a false FAIL somewhere; the criteria state the level per lane.
  - The Poisson bounds assume independent errors.
  - Compare the spread of the window counts with the Poisson spread.
  - When the windows spread wider, the errors cluster.
  - Then the lane is INCONCLUSIVE, or the bound uses the windows as its unit.
  - Separate the lock-in from a temperature effect.
  - Log the temperature per window.
  - Claim a warm-up effect only when the ratio tracks the temperature after the settling windows are excluded.
  - Test each unit as a sender and as a receiver.
  - One module sent clean and received at 1e-4 on all lanes.
  - Only a swap of the far unit showed which side failed.
  - Rule out one cause per run.
  - 'Write each one down: temperature, supply, tool, method, unit, cable direction.'
  - The list keeps the hunt short and a vendor question factual.
  - Number every unit before a multi-unit session, on the unit and in the record.
  - Four modules moved between three unmarked cases in one evening, and only the identity read told them apart.
  - Check the record name before the power goes up.
  - Refuse a record name that exists.
  - Open the record for exclusive create.
  - Write the identity first.
  - Check the record path and every permission flag of the run before the power goes up.
  - A run that fails at its record after the power-up leaves a hot unit and no record.
  - A command that writes its record and then re-raises needs one handler at the command dispatch.
  - A handler per command misses the next command.
  never:
  - A disabled lane stops at one bit
  - Use windows of 5 s or more
  - Judge warm
  - cold first seconds
  - Cold 120 s runs
  - and with rate × T² / 2, and record the model that fits
  - host interface rate over the media lane count
  - ask the vendor about the unit
  - Let the link settle
  - The verdict counts every window after the settling time
  - where the hardware allows
  - take 0.5 when it is unknown
  - the median of the later windows
- file: references/software-track.md
  section: '## 20. '
  heading: '## 20. Pattern tests between two ends'
  every_sentence: true
  must:
  - The checker's lock-loss flag latches from the moment the checker is enabled.
  - Read it once after the far generator is up.
  - Then reset the counters, verify the reset by a read-back, and open the gate (§23).
  - 'A long pattern function hides three reusable steps: arm, end-of-gate statistics, disable.'
  - Arm is the setup and the clearing of the latched flags; the settling is judged inside the run (§23).
  - Read back the pattern, the polarity and the enable at both ends before the gate.
  - Pull the three steps out.
  - A per-second trend and a far-end loopback then cost one loop each.
  - A module's opportunity counter may not grow at the lane rate.
  - Check its growth law in every window before you trust a rate from it (§23).
  - A far-end loopback carries the pattern while the checker reports lock loss for the whole gate and still counts.
  - Judge a loopback run on a per-second lock view, never on the end flag alone.
  - A link reads worse in its first seconds.
  - One per-second rate fell tenfold inside a minute.
  - A control is needed before you call that lock-in.
  - Apply the predeclared settling rule and report the settling (§23).
  - Say which fibre or cable set the floor; the wrong fibre type still links.
  - Judge each lane against the expected enable map.
  - A disabled lane's opportunity count stays near zero.
  - An enabled lane's opportunity counter grows at the lane rate (§23).
  - 'Judge on the counters: the latched lock-loss byte flickers on a marginal fibre in any short window.'
  - A host-side loop also acts as a far-end loopback.
  - A module in mission mode returns its media input through the loop to its media output.
  - The record names the topology.
  - A host-loop result is not a media-link result.
  - A host-side generator points at the host, not at the cable.
  - On a two-cage board with the host lanes cross-connected it drives the other end's host input, and the far media-side checker measures the whole path with no host present.
  - Use the module's gating timers for the window.
  - Record the actual gate start and end.
  - A gate that does not complete makes the window INCONCLUSIVE.
  - Read the error counters beside the derived rate.
- file: references/software-track.md
  section: '## 18. '
  heading: '## 18. Bring-up with few instruments, and the identity in the bridge chip'
  every_sentence: true
  must:
  - With no meter, the first power still has an order that limits the loss.
  - Charger on the power-only port for five seconds.
  - Read the LEDs, touch the parts, smell.
  - Then one minute.
  - The host port comes last.
  - '*Reason*: a short on the host port can take the computer''s port with it.'
  - A rail that is off still lights the LEDs on its pull-ups.
  - Write that into the plan, so the first reading is not a fault.
  - A tester whose module rail is a buck converter hums at no load.
  - The light-load mode makes the ceramic capacitors sing.
  - Note it for the next revision; it is not a fault.
  - The USB bridge chip's EEPROM carries the unit identity.
  - Build the image from an all-zero base and set every field.
  - A tool that writes only the bytes you name leaves the rest at 0xFF on a blank chip, the vendor and product ids included.
  - Print the image before any write, and check a read-back of record in the selftest.
  - 'The bytes the bridge chip never reads hold a board-info area with its own checksum: the board revision, the order, the case preset.'
  - Lay the whole chip out in one function.
  - The tool reads that area at open, with the product string, before any revision check.
  - '*Pitfall*: a merge moved the read out of the open path, and every run stopped at the revision check with no product.'
  - After an EEPROM write the chip resets and leaves the USB stack.
  - A re-plug of the host cable is part of the procedure, not a fault.
  - Read a module's EEPROM before you search for its part.
  - A label can carry a typo; the EEPROM carries the catalogue number.
  - A passive loopback plug and a passive copper cable are EEPROM-only tests on a bench tester.
  - 'Check the length and attenuation fields against the label: vendors leave them wrong or empty.'
  - A passive plug reads a flat memory, a zero temperature and a reserved state; that is the plug, not the bus.
  - Run the thermal throttle path once on every tester build before you trust a long hold.
  - A bare board with a cage sink and no air sheds about 5 to 6 degrees per watt, with a time constant near five minutes.
  - A posture table written from a model can be six times too low; the module's own sensor and the throttle are the control.
  - A dead bridge chip with its USB power LED on points at a latched input, current forced into a pin at cable attachment.
  - 'The recovery is a full power removal: host cable, charger and module out for thirty seconds.'
  - A USB re-plug alone does not clear it.
  - 'Isolate every bridge I/O that leaves the chip in the next revision: series resistors, a clamp array, powered-off isolation, a current-limited rail.'
  - A tester that cannot see its own power source relies on an operator flag.
  - Put a charger-present sense and a rail current monitor on the next revision, and make the release step refuse itself when the budget is not there.
  - The first meter session has its own traps.
  - A meter's low-impedance mode loads the node with a few kΩ.
  - It pulls a bled rail or a pull-up line down.
  - Use the plain DC volts range.
  - Use a designated circuit-ground test point as the ground point.
  - A press-fit connector cage holds a probe tip without slipping.
  - Use the cage only after you confirm that it ties to signal ground.
  - Many cages go to chassis through an RC.
  - A switched-off rail is not at 0 V while the host is plugged.
  - Idle-high bus lines feed it through their pull-ups into the bleeder; one board read 0.57 V.
  - Check a rail "off" with every source connected.
  - Trace every path that feeds the rail, and fix each one.
  - On that board the feed was the signal lines, not the rail.
  - A laptop USB-C port may offer 1.5 A only.
  - Read the source's current advertisement before you budget host power.
  - Read CC with the plain DC range, never the low-impedance mode.
  - Read it before a PD contract exists.
  - Over the sink's 5.1 kΩ pull-down, 0.25 to 0.61 V means Default USB power.
  - A reading of 0.70 to 1.16 V means 1.5 A.
  - A reading of 1.31 to 2.04 V means 3 A.
  - 'A reading between two bands is INCONCLUSIVE: measure again, never round it to a tier.'
  - Default USB Power is 100 mA unconfigured and 500 mA configured on USB 2.0.
  - On USB 3.x it is 150 mA unconfigured and 900 mA configured.
  - A two-lane USB 3.2 port allows 1500 mA configured.
  - Type-C Current at 1.5 A or 3 A is a separate grant, read only from the CC bands.
  - Battery Charging is another separate grant.
  - Budget only what the port has granted.
  - Under a PD contract, the negotiated limit comes from the accepted request (RDO), not from the CC voltage.
  - Decode the RDO against the PDO or APDO it selects and the cable's current capability.
  - It is a limit, not a measured current.
  - This skill carries no PD decoder; read the decoded contract from the sink controller's status.
  - A PD 3.0 source also moves its Rp between the 3 A and 1.5 A levels to signal collision avoidance.
  - A fan that is off reads like a bad module.
  - Three throttles in a row came from a fan with no power.
  - Look at the fan before you blame the module, and give the next revision a tachometer read.
  - A high-power window without a health poll is a hazard.
  - One run polled nothing between its windows.
  - The module crossed its warning limit and shut two lanes down.
  - Poll both ends between windows, with the throttle limit.
  - Set the poll period well under the thermal time constant.
  - A failed sensor read stops the run.
  - 'Two gates can let a high-power run through: the posture table and the power budget flag.'
  - The record names the gate that let the run through.
  - Pattern traffic adds heat over the idle hold at the same budget.
  - One fit under traffic read 13 K above the idle fit, with a slope 1.6 K/W steeper.
  - Size the cooling and the soak limits from a fit under traffic.
  never:
  - about 1.6 V means 3 A
  - Default USB power is 500, 900 or 1500 mA
- file: references/software-track.md
  never_re:
  - (?i)host[^.\n]*divid[^.\n]*lane
  - (?i)\b(five|5)\s*(s|seconds)\b[^.\n]*(longer|more|minimum)
  - (?i)square of (the )?time|fit a quadratic
  - (?i)(halts|stops) at (a single|one) bit
  never_re_examples:
  - The lane rate is the host rate divided by the number of media lanes.
  - Keep every gate five seconds long or longer.
  - Some bit counters grow as the square of time; fit a quadratic and accept it.
  - A disabled lane's counter halts at a single bit.
- file: references/pitfalls.md
  never:
  - Judge warm windows, never a cumulative counter from cold
  - per discipline before each gate
  - was the checker lock-in
  - held the lock-in burst
  never_re:
  - (?i)warm(ed)?[- ]up ones|judge (only )?(the )?warm
  never_re_examples:
  - Discard the cold windows and judge only warmed-up ones.
- file: evals/evals.json
  never:
  - bounded by the previous BER
  - bounds each window by the BER of the window before
  - It, treats
  - a confidence bound on a zero-error claim
navigation:
- file: SKILL.md
  must:
  - A measurement checks its own counters in every run, as the norm and never as a mode.
  - (`references/software-track.md` §23)
  - follows `references/release-and-cut.md` §15
  - follow `references/dfm-printed-enclosure.md` §8.7
  - follow `references/schematic-phase.md` §6
  - measurement counter checks (§23)
- file: references/software-track.md
  must:
  - Sections 3 to 23 hold the rules
studies:
- file: references/schematic-phase.md
  section: '## 6. '
  heading: '## 6. Studies before the next revision''s spec'
  every_sentence: true
  must:
  - 'A next revision opens with one study per open area: power, thermal and mechanics, signal integrity, the controller.'
  - Studies that share no file run in parallel.
  - Each one answers the owner's questions and ends in a recommendation.
  - '**The shape.** The short answer comes first.'
  - Then the inputs from the bench records, the options, the recommendation and the owner questions, each with a recommended answer.
  - Then what the note does not know, the learnings for the log and the sources.
  - The owner's answers go at the end of the same file, and the decisions they make become decision rows.
  - '**Live parts.** Every part a study names is read live that day and tagged (`references/part-verification.md`).'
  - The rows go into the parts table.
  - A part that could not be read live sits in its own section, never in the recommendation.
  - '**The bench first.** A study starts from what the last revision measured: its power, its heat, its faults.'
  - Rules the studies found, for any next revision.
  - The worked examples come from one two-ended test product.
  - '**Power budget.** An end-to-end test of a two-ended product loads both ports at once.'
  - Budget the sum of both ends.
  - '**Protection switch.** Size a protection switch by its drop at the rail current.'
  - One 28 mΩ switch at 5 A on a 3.3 V rail drops 0.14 V and burns 0.7 W.
  - Also check its safe operating area, inrush, current limit, reverse current and fault energy.
  - '**Overvoltage.** A high input voltage makes a failed regulator a load killer.'
  - Put an overvoltage cut-off between the regulator and the load.
  - '**Back-power.** A rail part does not stop back-power through signal lines.'
  - List every path that can feed the rail.
  - Check each path for isolation, voltage, direction and reset behaviour.
  - A bus buffer with a rated Ioff isolates only the paths it covers.
  - A tristate state in the tool helps only while the tool runs; it is not fail-safe at reset.
  - '**USB power sink.** Pick the sink controller by its fallback on a source with no PD.'
  - One kind reports the Type-C current there; another reports nothing.
  - A PD source that offers only a 5 V PDO is a different case; test both.
  - A sink controller may keep the source capabilities only until the next message overwrites its buffer.
  - Read that behaviour in the chosen controller's datasheet.
  - The firmware copies the capabilities on the alert.
  - To read them again, it sends Get_Source_Cap.
  - A soft reset is protocol recovery, not a query.
  - Use it only as the PD policy engine and the controller's datasheet direct.
  - '**Fan start-up.** A fan controller''s duty after a power cycle is undefined until you verify it.'
  - A volatile curve can leave the fan at 0 % with no host.
  - Use a part with an EEPROM, or a controller with the curve in flash.
  - Verify a safe reset default duty.
  - '**Over-temperature.** Give the load an over-temperature path that needs no host.'
  - '**Airflow.** The airflow sits where the fan curve meets the impedance curve of the whole enclosure: grille, filters and path.'
  - Model or measure them together.
  - This skill carries no flow solver; a bench measurement decides.
  - 'Worked example: a 1-D estimate gave 20 to 27 % of free flow behind 212 mm² of slots.'
  - A 30 mm fan's gross disc is about 700 mm², and a 40 mm fan's about 1250 mm².
  - '**Heat capacity.** Measure the load''s heat capacity on the bench before you set the fan''s response.'
  - On one bench, 8 W raised a module 11 K in 60 s, with the losses neglected.
  - That reading, about 44 J/K, overstates C.
  - 'Use a conservative lower bound on C: the initial slope, or a fit of the net heat flow.'
  - Use the worst-case net heat.
  - The time from detection to full airflow is at most ΔT_margin × C_low / P_worst.
  - That time holds the sensor lag, the command and the spin-up.
  - '**Sizing.** Size the electronics for the top load power.'
  - Size the heat sink for every load and ambient the product supports.
  - Otherwise enforce a lower power limit, with an independent thermal shutdown.
  - '**Units.** Write GBd for a symbol rate and Gb/s for a bit rate, never one number for both.'
  - A PAM4 lane carries two bits per symbol.
  - '**Loops on a connector.** Loop a transmit pair to a neighbour lane''s receive pair.'
  - Pair placement alone does not prove one-layer routing.
  - Check the drawing and the whole launch and routing geometry.
  - A checker that locks on the same pattern from any lane cannot prove the lane map.
  - 'Challenge every physical lane on its own: a lane-unique pattern or seed, or an error injected on that lane.'
  - 'Verify the whole map: the lane order, the polarity and the direction.'
  - Match the polarity and the precoding per lane on the loop.
  - Check the crosstalk between neighbouring loops against the SI budget.
  - Follow the interface specification and the schematics of both ends for AC coupling.
  - State where each path is coupled.
  - Give each path exactly one compliant coupling stage.
  - '**Pads and the stack.** A wide pad over thin prepreg can drop below the target impedance (`references/pcb-layout-dfm.md` §3).'
  - Connectors mirrored on both board faces set the board thickness and the termination.
  - Read the fab's live thickness table by layer count before a study recommends them.
  - '**The controller.** A module family can carry other temperature ratings per memory option.'
  - Pick by the quantity the datasheet rates (ambient, case or junction) at the worst local temperature, with self-heating and margin.
  - Never pick by the deepest stock.
  - A part rated for a single reflow goes on the side reflowed last.
  - Confirm the order with the assembler (`references/pcb-layout-dfm.md` §9).
  - Read the controller's errata for its USB download path, and keep the ROM recovery path and its pins free.
  never:
  - or sends a soft reset to get them again
  - Use a soft reset only when that fails
  - A pattern checker does not care which generator lane feeds it
  - That fan must reach full speed inside 30 s
  - gives at most about 27 s
  - needs none on the loop
pockets:
- file: references/dfm-printed-enclosure.md
  section: '### 8.7 '
  heading: '### 8.7 Side pockets, bosses, screw wells and feet **[measured]**'
  every_sentence: true
  must:
  - Check the wall budget before a magnet station is promised.
  - The axial stack is the disc thickness, the bondline, the floor behind it and the worst-case print tolerance.
  - It must fit the wall or the boss.
  - 'Worked example: in a 2.0 wall, a 3.175 disc needed an inward boss.'
  - 'The radial fit is separate: the pocket diameter is the disc diameter plus the insertion clearance plus the print tolerance.'
  - The boss needs room under any deck ring.
  - Where it crosses the vent band, drop the slots under it after the vent register is chosen.
  - A side pocket needs a full wall behind its floor plane at every Z it spans.
  - Find the Z band where the body is a full wall.
  - Put the pocket there.
  - On the axis, the pocket depth plus the proud height equals the disc thickness plus the bondline.
  - Work out the minimum and the maximum proud height from the worst-case depth, disc and bondline tolerances.
  - 'Set the proud height from the mating need: gap, adhesive and contact.'
  - Then check that the pocket depth fits the wall.
  - Never pick either one alone.
  - Count the roof over a side pocket along its whole depth, not only inside the ring.
  - A pocket that runs past the wall can sit under an opening, over the board.
  - 'Evaluate the inward option first: the pocket into the wall with a local thickening.'
  - A proud boss breaks a flush pair, because two coupled units then touch at the boss, not along their faces.
  - A boss on a vertical face of an upright FDM print needs a printable underside.
  - A round underside is a flat overhang at its lowest band.
  - A V or teardrop underside works when its flanks stay within the overhang limit.
  - Blunt its tip to the design wall (`wall_gate + design_margin`).
  - Then check the sliced minimum and the census margin.
  - Otherwise run the boss down to the bed plane as a slab.
  - A pad disc that meets a boss ring leaves a narrow notch at the joint.
  - The census reads the notch as a thin wall.
  - Hull the pad to the ring where the clearance allows.
  - Re-run the census.
  - Two features that meet on one plane at a step leave a saddle.
  - One face points +X above the step, the other -X below it.
  - The census reads the saddle as a thin wall (0.32 on one deck).
  - Run the fused feature to the outline where the function allows.
  - A light baffle under a printed deck is a wall, so it cannot be thinner than the census gate.
  - Make the cell wall the design wall (`wall_gate + design_margin`, §0).
  - Make the cell the pitch minus that wall.
  - Trim a lip the baffle crosses from past the deck edge.
  - A trim box that starts at the baffle face leaves a sliver ahead of it.
  - 'A screw well printed sole down has a roof: the counterbore seat prints in air.'
  - Set the bridge layers from the validated process, the span and the seat strength.
  - Read the G-code (`fdm-print-optimisation.md` §5).
  - 'Worked FDM example: two layers, a bore-wide slot and then a bore-wide square.'
  - Each layer then spans wall to wall.
  - Give the screw a reachable head.
  - Give the foot a full land.
  - 'One layout does both: a foot beside its screw, with a land to the counterbore mouth.'
  - A foot over the counterbore hides the screw and comes off at every screw removal.
  - Rerun the stability row after every foot move (`references/case-pipeline.md` §Stability).
  - Apply a local exception after the shared rule it breaks.
  - Drop a vent slot under a boss after the vent register is chosen.
  - A boss added to the register's input moves the register of every face.
  - A plain bar in a plain pocket is a shear key, as tight as its fit.
  - List the six degrees of freedom of the joint.
  - Check each one at the worst-case fit and engagement.
  - A bar can still slide along its own axis, and it does not resist separation normal to the faces.
  - A clip that holds against separation must pull the two outer faces together.
  never:
  - Make the cell wall the gate wall
  - cannot end round or in a V
  - holds lift and twist
  - Blunt its tip to the wall gate
  - sum to the disc thickness
- file: references/pitfalls.md
  never:
  - Design 0.1 over the gate
public-export:
- file: references/release-and-cut.md
  section: '## 15. '
  heading: '## 15. A public export from the private tree'
  every_sentence: true
  must:
  - A public export ships only what a fail-closed leak gate has read.
  - One generator builds the public tree from a yaml list of what goes out.
  - The generator is project code, like the cut generator (§7).
  - A leak gate reads every exported file of the final tree.
  - The push depends on a clean gate.
  - Only `scripts/generic_lint.py --export <tree> --allow <file>` is the leak gate.
  - The plain lint mode is not.
  - The export mode fails without a private term file that holds name patterns.
  - It prints the pattern count of each group.
  - It reads every file, every file name and every symlink target.
  - 'It skips no `generic: ok` line, no worked example and no history.'
  - It refuses a `.git` folder in the export root.
  - Scan the outgoing commit messages, authors and tags on their own.
  - Write them to a file in an empty folder, then run `--export` on that folder.
  - It sorts files by type.
  - An archive, a PDF, an image, compressed text or UTF-16 text is a binary for review.
  - It scans the readable strings of each, the PNG text chunks included.
  - 'Read the metadata of each binary with `exiftool -a -G1` before you allow it as `binary: <path>`.'
  - 'An allow entry is typed: `url: <exact string>` or `key: <exact string>`.'
  - A bare line, a short string or a private name is refused.
  - No shipped CI template runs this gate.
  - Run it by hand before each public push.
  - A CI job that runs it writes the private terms from a secret to a temporary file and sets `HWFS_PRIVATE_TERMS`.
  - A missing or empty secret must stop the job.
  - Never commit the terms.
  - The gate refuses decision and review ids, private paths, order numbers, private vendor and person names, and the company name.
  - Two blind reviews come before every public push.
  - The owner's word is the go.
  - Give the gate every id format the records use, the review finding ids included.
  - Anchor each pattern on word boundaries.
  - The unanchored `E-[0-9]+` matched the `E-3` inside `X-LANE-3`.
  - Allow the public repository address as a `url:` entry.
  - The address carries the account name, so the name pattern hits every page link.
  - The gate strips the exact allowed string before the match.
  - It never skips the line that holds it.
  - The gate also hits data keys.
  - Rename the label the user sees.
  - Keep a key only when the owner approves it as public schema.
  - Allow that key as a `key:` entry.
  - Docstrings and comments ship.
  - Run the gate and the writing lint over them, or strip them in the export.
  - A stripper must parse the language.
  - A nested `${}` in a JS template literal ended a string early, and 20 of 110 comments survived.
  - Check the result with the language's syntax check.
  - Count the comments that stay.
  - Write the public pages from the generator yaml and the rendered pictures, not from the manual.
  - A manual describes the version of its own date.
  - Name a control by the word printed on the part.
  - The yaml, the software and the print can disagree.
  - Keep one name table on the hardware page.
  - Give the software word in brackets at first use.
  - An engineering drawing is not a user drawing.
  - Its callouts carry ids, vendor names and private paths.
  - A public sheet needs its own generator option.
  - Until then, publish a dimension table and the rendered faces.
  - Before a public screenshot, replace the login name and the record paths in the page.
  - 'A screenshot captured into the public tree is its own source: the export keeps it and never rebuilds it.'
  - Record its capture command, date and page state in the export yaml.
  - The leak gate cannot read pixels.
  - Each blind review reads every screenshot.
  - On GitHub Pages, enable the hosting before the first push of a Pages workflow.
  - The configure step can enable it only with a token that has Pages admin rights.
  - Otherwise the first deploy fails while Pages does not exist.
  never:
  - allow the key by a regex on its line
  - Allow the public repository address on its own line
  - The configure step can also enable it
