# evals/core_rules.yaml — the core rules that must stay in the references, and the folklore that must stay out.
# Read by scripts/rule_check.py (eval 19, the smoke). `--mutate` deletes each guarded rule and inserts each banned phrase in a
# scratch copy, one at a time, and fails when one of them stays green. A new bullet in an `every_bullet` section needs a must phrase.
measurement:
  - file: references/software-track.md
    section: '## 23. '
    every_bullet: true
    must:
      - No flag or mode turns them off
      - Keep the raw reads of every window
      - Record what each counter counts
      - 'Record the FEC point of each count: pre-FEC or post-FEC'
      - Take the lane rate from the side where the checker sits
      - Include the encoding and FEC overhead
      - The bit counter grows at the lane rate × T
      - Any other growth law is a counter fault, and the window is INCONCLUSIVE
      - Use counter deltas within one verified reset epoch
      - read them back near zero
      - Skip the reads of the first update interval after a reset
      - Bound the window length so that a wrap cannot be missed
      - Bound each later window by the BER of the window before
      - A step of half the modulus or more between two reads invalidates the window
      - A proven wrap is a lower bound on the errors
      - Compute the BER two ways
      - State the tolerance before the run
      - A mismatch beyond the tolerance makes the window INCONCLUSIVE
      - A deaf checker reads zero errors on any link
      - Inject known errors, or run a known-bad path
      - A lock loss after the settling is verdict-bearing
      - The start-up settling is a rule fixed before the run, with a maximum time
      - Exclude the settling windows from the verdict and report them
      - Never move the settling point after you see the data
      - Every window after the settling counts
      - The first window after a release measures the checker lock-in
      - The verdict uses run totals per lane and per direction
      - Never average window rates
      - Never judge the last window alone
      - Any invalid window makes the run INCONCLUSIVE
      - A zero-error claim carries its confidence bound
      - Fewer bits give INCONCLUSIVE, never PASS
      - Claim a warm-up effect only when the rate tracks the temperature
      - Test each unit as a sender and as a receiver
      - Rule out one cause per run
      - Number every unit before a multi-unit session
      - Check the record name before the power goes up
      - Refuse a record name that exists
      - one handler at the command dispatch
    never:
      - A disabled lane stops at one bit
      - Use windows of 5 s or more
      - Judge warm
      - cold first seconds
      - Cold 120 s runs
      - and with rate × T² / 2, and record the model that fits
      - host interface rate over the media lane count
      - ask the vendor about the unit
      - Let the link settle
      - The verdict counts every window after the settling time
  - file: references/software-track.md
    section: '## 20. '
    must:
      - Check its growth law in every window before you trust a rate from it (§23)
      - Judge each lane against the expected enable map
      - A host-loop result is not a media-link result
  - file: references/software-track.md
    section: '## 18. '
    must:
      - 0.25 to 0.61 V means Default USB power
      - Under a PD contract, the contract sets the current
    never:
      - about 1.6 V means 3 A
  - file: references/pitfalls.md
    never:
      - Judge warm windows, never a cumulative counter from cold
navigation:
  - file: SKILL.md
    must:
      - as the norm and never as a mode
      - (`references/software-track.md` §23)
      - follows `references/release-and-cut.md` §15
      - follow `dfm-printed-enclosure.md` §8.7
      - follow `references/schematic-phase.md` §6
  - file: references/software-track.md
    must:
      - Sections 3 to 23 hold the rules
studies:
  - file: references/schematic-phase.md
    section: '## 6. '
    must:
      - A next revision opens with one study per open area
      - Every part a study names is read live that day
      - To read them again, it sends Get_Source_Cap
      - Use a soft reset only when that fails
      - t ≤ ΔT_margin × C / P
      - A pattern checker cannot prove the lane map
      - Prove the map separately
    never:
      - or sends a soft reset to get them again
      - A pattern checker does not care which generator lane feeds it
      - That fan must reach full speed inside 30 s
pockets:
  - file: references/dfm-printed-enclosure.md
    section: '### 8.7 '
    must:
      - Check the wall budget before a magnet station is promised
      - Count the roof over a side pocket along its whole depth
      - Make the cell wall the design wall
      - Put a foot beside its screw
      - A plain bar in a plain pocket is a shear key
    never:
      - Make the cell wall the gate wall
      - cannot end round or in a V
      - holds lift and twist
  - file: references/pitfalls.md
    never:
      - Design 0.1 over the gate
public-export:
  - file: references/release-and-cut.md
    section: '## 15. '
    must:
      - A leak gate reads every exported file
      - The push depends on a clean gate
      - Two blind reviews come before every public push
      - Anchor each pattern on word boundaries
      - Strip the exact allowed string before the match
      - Docstrings and comments ship
    never:
      - allow the key by a regex on its line
      - Allow the public repository address on its own line
