studies:
- file: references/schematic-phase.md
  section: '## 6. '
  heading: '## 6. Studies before the next revision''s spec'
  every_sentence: true
  must:
  - 'A next revision opens with one study per open area: power, thermal and mechanics, signal integrity, the controller.'
  - Studies that share no file run in parallel.
  - Each one answers the owner's questions and ends in a recommendation.
  - '**The shape.** The short answer comes first.'
  - Then the inputs from the bench records, the options, the recommendation and the owner questions, each with a recommended answer.
  - Then what the note does not know, the learnings for the log and the sources.
  - The owner's answers go at the end of the same file, and the decisions they make become decision rows.
  - '**Live parts.** Every part a study names is read live that day and tagged (`references/part-verification.md`).'
  - The rows go into the parts table.
  - A part that could not be read live sits in its own section, never in the recommendation.
  - '**The bench first.** A study starts from what the last revision measured: its power, its heat, its faults.'
  - Rules the studies found, for any next revision.
  - The worked examples come from one two-ended test product.
  - '**Power budget.** An end-to-end test of a two-ended product loads both ports at once.'
  - Budget the sum of both ends.
  - '**Protection switch.** Size a protection switch by its drop at the rail current.'
  - One 28 mΩ switch at 5 A on a 3.3 V rail drops 0.14 V and burns 0.7 W.
  - Also check its safe operating area, inrush, current limit, reverse current and fault energy.
  - '**Overvoltage.** A high input voltage makes a failed regulator a load killer.'
  - Put an overvoltage cut-off between the regulator and the load.
  - '**Back-power.** A rail part does not stop back-power through signal lines.'
  - List every path that can feed the rail.
  - Check each path for isolation, voltage, direction and reset behaviour.
  - A bus buffer with a rated Ioff isolates only the paths it covers.
  - A tristate state in the tool helps only while the tool runs; it is not fail-safe at reset.
  - '**USB power sink.** Pick the sink controller by its fallback on a source with no PD.'
  - One kind reports the Type-C current there; another reports nothing.
  - A PD source that offers only a 5 V PDO is a different case; test both.
  - A sink controller may keep the source capabilities only until the next message overwrites its buffer.
  - Read that behaviour in the chosen controller's datasheet.
  - The firmware copies the capabilities on the alert.
  - To read them again, it sends Get_Source_Cap.
  - A soft reset is protocol recovery, not a query.
  - Send a soft reset only when the PD policy engine and the controller's datasheet call for recovery.
  - '**Fan start-up.** A fan controller''s duty after a power cycle is undefined until you verify it.'
  - A volatile curve can leave the fan at 0 % with no host.
  - Use a part with an EEPROM, or a controller with the curve in flash.
  - Verify a safe reset default duty.
  - '**Over-temperature.** Give the load an over-temperature path that needs no host.'
  - '**Airflow.** The airflow sits where the fan curve meets the impedance curve of the whole enclosure: grille, filters and path.'
  - Model or measure them together.
  - This skill carries no flow solver; a bench measurement decides.
  - 'Worked example: a 1-D estimate gave 20 to 27 % of free flow behind 212 mm² of slots.'
  - A 30 mm fan's gross disc is about 700 mm², and a 40 mm fan's about 1250 mm².
  - '**Heat capacity.** Measure the load''s heat capacity on the bench before you set the fan''s response.'
  - On one bench, 8 W raised a module 11 K in 60 s, with the losses neglected.
  - That reading, about 44 J/K, overstates C.
  - Sensor lag flattens the measured slope and overstates C again.
  - Fit the sensor lag with the net heat flow.
  - Otherwise use an independent conservative C, from the masses and their specific heats.
  - Use the worst-case net heat.
  - The time from detection to full airflow is at most ΔT_margin × C_low / P_worst.
  - That time holds the sensor lag, the command and the spin-up.
  - '**Sizing.** Size the electronics for the top load power.'
  - Size the heat sink for every load and ambient the product supports.
  - Otherwise enforce a lower power limit, with an independent thermal shutdown.
  - '**Units.** Write GBd for a symbol rate and Gb/s for a bit rate, never one number for both.'
  - A PAM4 lane carries two bits per symbol.
  - '**Loops on a connector.** Loop a transmit pair to a neighbour lane''s receive pair.'
  - Pair placement alone does not prove one-layer routing.
  - Check the drawing and the whole launch and routing geometry.
  - A checker that locks on the same pattern from any lane cannot prove the lane map.
  - 'Challenge every physical lane on its own: a lane-unique pattern or seed, or an error injected on that lane.'
  - 'Verify the whole map: the lane order, the polarity and the direction.'
  - Match the polarity and the precoding per lane on the loop.
  - Check the crosstalk between neighbouring loops against the SI budget.
  - Take the number, value and placement of the coupling stages from the interface specification and the schematics of both ends.
  - State where each path is coupled.
  - '**Pads and the stack.** A wide pad over thin prepreg can drop below the target impedance (`references/pcb-layout-dfm.md` §3).'
  - Connectors mirrored on both board faces set the board thickness and the termination.
  - Read the fab's live thickness table by layer count before a study recommends them.
  - '**The controller.** A module family can carry other temperature ratings per memory option.'
  - Pick by the quantity the datasheet rates (ambient, case or junction) at the worst local temperature, with self-heating and margin.
  - Never pick by the deepest stock.
  - A part rated for a single reflow goes on the side reflowed last.
  - Confirm the order with the assembler (`references/pcb-layout-dfm.md` §9).
  - Read the controller's errata for its USB download path, and keep the ROM recovery path and its pins free.
  never:
  - or sends a soft reset to get them again
  - Use a soft reset only when that fails
  - A pattern checker does not care which generator lane feeds it
  - That fan must reach full speed inside 30 s
  - gives at most about 27 s
  - needs none on the loop
pockets:
- file: references/dfm-printed-enclosure.md
  section: '### 8.7 '
  heading: '### 8.7 Side pockets, bosses, screw wells and feet **[measured]**'
  every_sentence: true
  must:
  - Check the wall budget before a magnet station is promised.
  - Write the axial stack with signed worst cases.
  - The wall W holds a pocket of depth D and a floor F = W − D.
  - The floor needs F_min = W_min − D_max ≥ the floor gate.
  - 'Worked example: in a 2.0 wall, a 3.175 disc needed an inward boss.'
  - Write the radial fit with signed worst cases too.
  - The smallest printed pocket minus the largest disc is at least the insertion clearance.
  - 'In symbols: P_nom − P_tol − d_max ≥ c_min.'
  - The boss needs room under any deck ring.
  - Where it crosses the vent band, drop the slots under it after the vent register is chosen.
  - A side pocket needs a full wall behind its floor plane at every Z it spans.
  - Find the Z band where the body is a full wall.
  - Put the pocket there.
  - On the axis, take a disc of thickness t on a bondline b.
  - Its proud height p is t + b − D.
  - Its worst cases are p_min = t_min + b_min − D_max and p_max = t_max + b_max − D_min.
  - 'Set the proud height from the mating need: gap, adhesive and contact.'
  - Then check that the pocket depth fits the wall.
  - Never pick either one alone.
  - Count the roof over a side pocket along its whole depth, not only inside the ring.
  - A pocket that runs past the wall can sit under an opening, over the board.
  - 'Evaluate the inward option first: the pocket into the wall with a local thickening.'
  - A proud boss breaks a flush pair, because two coupled units then touch at the boss, not along their faces.
  - A boss on a vertical face of an upright FDM print needs a printable underside.
  - A round underside is a flat overhang at its lowest band.
  - A V or teardrop underside works when its flanks stay within the overhang limit.
  - Blunt its tip to the design wall (`wall_gate + design_margin`).
  - Then check the sliced minimum and the census margin.
  - Otherwise run the boss down to the bed plane as a slab.
  - A pad disc that meets a boss ring leaves a narrow notch at the joint.
  - The census reads the notch as a thin wall.
  - Hull the pad to the ring where the clearance allows.
  - Re-run the census.
  - Two features that meet on one plane at a step leave a saddle.
  - One face points +X above the step, the other -X below it.
  - The census reads the saddle as a thin wall (0.32 on one deck, a dated worked example).
  - Run the fused feature to the outline where the function allows.
  - A light baffle under a printed deck is a wall, so it cannot be thinner than the census gate.
  - Make the cell wall the design wall (`wall_gate + design_margin`, §0).
  - Make the cell the pitch minus that wall.
  - Trim a lip the baffle crosses from past the deck edge.
  - A trim box that starts at the baffle face leaves a sliver ahead of it.
  - 'A screw well printed sole down has a roof: the counterbore seat prints in air.'
  - Set the bridge layers from the validated process, the span and the seat strength.
  - Read the G-code (`fdm-print-optimisation.md` §5).
  - 'Worked FDM example: two layers, a bore-wide slot and then a bore-wide square.'
  - Each layer then spans wall to wall.
  - Give the screw a reachable head.
  - Give the foot a full land.
  - 'One layout does both: a foot beside its screw, with a land to the counterbore mouth.'
  - A foot over the counterbore hides the screw and comes off at every screw removal.
  - Rerun the stability row after every foot move (`references/case-pipeline.md` §Stability).
  - Apply a local exception after the shared rule it breaks.
  - Drop a vent slot under a boss after the vent register is chosen.
  - A boss added to the register's input moves the register of every face.
  - A plain bar in a plain pocket is a shear key, as tight as its fit.
  - List the six degrees of freedom of the joint.
  - Check each one at the worst-case fit and engagement.
  - A bar can still slide along its own axis, and it does not resist separation normal to the faces.
  - A clip that holds against separation must pull the two outer faces together.
  never:
  - Make the cell wall the gate wall
  - cannot end round or in a V
  - holds lift and twist
  - Blunt its tip to the wall gate
  - sum to the disc thickness
- file: references/pitfalls.md
  never:
  - Design 0.1 over the gate
public-export:
- file: references/release-and-cut.md
  section: '## 15. '
  heading: '## 15. A public export from the private tree'
  every_sentence: true
  must:
  - A public export ships only what a fail-closed leak gate has read.
  - One generator builds the public tree from a yaml list of what goes out.
  - The generator is project code, like the cut generator (§7).
  - A leak gate reads every exported file of the final tree.
  - The push depends on a clean gate.
  - Only `scripts/generic_lint.py --export <tree> --allow <file>` is the leak gate.
  - The plain lint mode is not.
  - The export mode pins the skill's generic rules; `--terms` is refused with it.
  - It fails without a private term file.
  - 'That file needs patterns in every promised group: people, project and company, order ids, private parts and vendors.'
  - It prints the pattern count of each group.
  - It reads every file, every file name and every symlink target.
  - 'Inside the export it skips no `generic: ok` line, no worked example and no history file.'
  - It matches each line after Unicode normalisation, and across each line break.
  - It refuses a `.git` file or folder anywhere in the tree.
  - Export or copy the tree to an empty folder, and scan that folder.
  - Scan the outgoing commit messages, authors and tags on their own.
  - Write them to a file in an empty folder.
  - Then run `--export` on that folder.
  - It sorts files by type.
  - It decompresses zip, 3MF, Office, gzip, svgz, bz2 and xz members, and PDF Flate streams, before the match.
  - It reads UTF-16 text and PNG text chunks.
  - A file or stream it cannot decode is a hit.
  - Every binary needs a human read before it is allowed.
  - 'Extract its text and its metadata: unzip, `pdftotext`, `exiftool -a -G1`.'
  - Read both.
  - 'Allow a reviewed binary as `binary: <path> <sha256>`.'
  - A changed file fails its hash, so it is a hit again.
  - 'An allow entry is typed: `url: <exact string>`, `key: <exact string>` or `binary: <path> <sha256>`.'
  - A bare line or a short string is refused.
  - A value that contains any private, generic or id match is refused.
  - An allow entry that matches no file fails the run.
  - A public account name is not a private term.
  - Keep it out of the private file, or the repository address cannot be allowed.
  - No shipped CI template runs this gate.
  - Run it by hand before each public push.
  - A CI job that runs it writes the private terms from a secret to a temporary file.
  - It sets `HWFS_PRIVATE_TERMS`.
  - A missing or empty secret stops the job.
  - Never commit the terms.
  - The gate refuses decision and review ids, private paths, order numbers, private vendor and person names, and the company name.
  - Two blind reviews come before every public push.
  - The owner's word is the go.
  - Give the gate every id format the records use, the review finding ids included.
  - Anchor each pattern on word boundaries.
  - The unanchored `E-[0-9]+` matched the `E-3` inside `X-LANE-3`.
  - Allow the public repository address as a `url:` entry.
  - The address carries the account name, so the name pattern hits every page link.
  - The gate strips the exact allowed string before the match.
  - It never skips the line that holds it.
  - The gate also hits data keys.
  - Rename the label the user sees.
  - Keep a key only when the owner approves it as public schema.
  - Allow that key as a `key:` entry.
  - Docstrings and comments ship.
  - Run the gate and the writing lint over them, or strip them in the export.
  - A stripper must parse the language.
  - A nested `${}` in a JS template literal ended a string early, and 20 of 110 comments survived.
  - Check the result with the language's syntax check.
  - Count the comments that stay.
  - Write the public pages from the generator yaml and the rendered pictures, not from the manual.
  - A manual describes the version of its own date.
  - Name a control by the word printed on the part.
  - The yaml, the software and the print can disagree.
  - Keep one name table on the hardware page.
  - Give the software word in brackets at first use.
  - An engineering drawing is not a user drawing.
  - Its callouts carry ids, vendor names and private paths.
  - A public sheet needs its own generator option.
  - Until then, publish a dimension table and the rendered faces.
  - Before a public screenshot, replace the login name and the record paths in the page.
  - 'A screenshot captured into the public tree is its own source: the export keeps it and never rebuilds it.'
  - Record its capture command, date and page state in the export yaml.
  - The leak gate cannot read pixels.
  - Each blind review reads every screenshot.
  - On GitHub Pages, enable the hosting before the first push of a Pages workflow.
  - The configure step can enable it only with a token that has Pages admin rights.
  - Otherwise the first deploy fails while Pages does not exist.
  never:
  - allow the key by a regex on its line
  - Allow the public repository address on its own line
  - The configure step can also enable it
