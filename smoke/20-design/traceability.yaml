# one entry per traceable item; stages in yaml order; every D-/CC- row of DECISIONS must be cited by some entry's source
stages:
  schematic:
    reached: [{type: exists, path: 20-design/parts.yaml}, {type: exists, path: 30-board/layout/smoke.xml}]
  placement:
    requires: [schematic]
    reached: [{type: md5_in, path: 30-board/kicad/smoke/smoke.kicad_pcb, file: 30-board/fab/*/board_id.txt, regex: '^md5 ([0-9a-f]{32})'}]
  routing:
    requires: [placement]
    reached: [{type: exists, path: out/drc.json}]      # the smoke has no DRC run: every routing row reads PENDING(routing)
entries:
  - {id: D-01.1, source: D-01, requirement: board 30 x 50 mm two layers, lands_in: 20-design/board.yaml, stage: schematic,
     checks: [{type: yaml_key, path: 20-design/board.yaml, key: board.width, expected: 30.0}, {type: yaml_key, path: 20-design/board.yaml, key: board.layers, expected: 2}]}
  - {id: D-02.1, source: D-02, requirement: USB-C mid-mount pads accepted at the notch wall in the DFM mirror, lands_in: 20-design/board.yaml dfm_accepted, stage: schematic,
     checks: [{type: grep, path: 20-design/board.yaml, regex: 'check: Pad to board edge, refs: \[J1\]'}]}
  - {id: D-03.1, source: D-03, requirement: two-piece FDM case, lands_in: 20-design/case.yaml, stage: schematic,
     checks: [{type: yaml_key, path: 20-design/case.yaml, key: case.pieces, contains: hood}, {type: yaml_key, path: 20-design/case.yaml, key: case.preset_default, expected: fdm}]}
  - {id: CC-001.1, source: CC-001, requirement: copper rules at the fab minimum + 0.01, lands_in: 20-design/board.yaml, stage: schematic,
     checks: [{type: yaml_key, path: 20-design/board.yaml, key: design_rules.min_track, expected: 0.16}]}
  - {id: CC-002.1, source: CC-002, requirement: every part carries a verified code, lands_in: 20-design/parts.yaml, stage: schematic,
     checks: [{type: grep, path: 20-design/parts.yaml, regex: 'confidence: K', absent: true}, {type: netlist_net, node: C1.2, net: GND}]}
  - {id: CC-002.2, source: CC-002, requirement: the fab DFM mirror has 0 open items, lands_in: out/dfm.json, stage: routing,
     checks: [{type: command, label: dfm_check, cmd: '{PY} scripts/dfm_check.py', expect_rc: 0}]}
  - {id: CC-003.1, source: CC-003, requirement: owner question — case colour, lands_in: —, stage: schematic, status: not_included, reason: OPEN owner question (CC-003)}
