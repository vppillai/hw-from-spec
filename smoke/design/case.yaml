# FIXTURE numbers for the smoke run, not rules: the print rules live in project.yaml print_targets (references/dfm-printed-enclosure.md)
case:
  version: v0.1-smoke
  pieces: [tray, hood]
  wall: 1.6
  clearance_board: 0.3
  preset_default: fdm
