# smoke/project.yaml — the smallest project that drives every generic hw-from-spec script (schema: references/project-yaml.md).
project:
  name: smoke
  owner: {name: smoke, email: s@s}            # the smoke commits as `smoke <s@s>`; gate_check.py --release compares the release line's author with this
  description: one sheet, five parts, a two-piece printed case — the automated dry run of the skill
skill: {repo: local, commit: smoke, version: smoke}   # scripts/skill_retro.py reads `version` (a fixture value)
ids: {owner_prefix: D, agent_prefix: CC, blocker_prefix: B}
markers:
  release_regex: 'clear[ -]to[ -]build'
  unverified: [UNVERIFIED, TBD-DRAWING]
  nod_regex: '\(!\)|owner nod'
  placed_regex: '\bPLACED\b'                # an owner row with this word + the package name = a placed order: judged on its frozen stock records
paths:
  decisions: 90-log/DECISIONS.md
  blockers: 90-log/BLOCKERS.md
  gates: 90-log/GATES.md
  status: 90-log/STATUS.md
  known_issues: 90-log/KNOWN_ISSUES.md
  test_plan: 20-design/TEST_PLAN.md
  traceability_yaml: 20-design/traceability.yaml
  traceability_out: 90-log/TRACEABILITY.md
  board: 30-board/kicad/smoke/smoke.kicad_pcb          # here a stub; a real project points at the generated board
  netlist: out/smoke.xml
  fab_dir: 30-board/fab                            # <rev>/board_id.txt names the board of record (by its md5 line)
  release_dir: 70-release
  collateral_dir: 70-release/collateral
  case_yaml: 20-design/case.yaml
tools:
  python: .venv/bin/python                    # the scripts' interpreter (pyyaml); the smoke run symlinks the skill venv here
  kicad_cli: kicad-cli                        # not called by the smoke run
  kicad_python: python3
fab_dfm:                                      # the board's fab-DFM mirror (references/fab-dfm.md); `dfm:` is the old spelling
  thresholds: design/dfm_thresholds.json      # copied from the fab's viewer with source + date
  items: out/dfm_items.json                   # written by the project's measurer (here: a hand-written fixture)
  accept: 20-design/board.yaml                   # key dfm_accepted: [{check, refs, reason, date, evidence}]
  report: out/dfm.json                        # written on every plain run; `dfm_check.py --check` compares
  bar: {open: 0, warnings_fail: true, accepted_requires: [reason, date, evidence]}   # zero / zero / no waivers (owner D-01 in a real project)
print_targets:                                # FIXTURE targets for the smoke run (references/dfm-printed-enclosure.md; the census reads these, never a script constant)
  vendor_mjf: {vendor: JLC3DP, process: MJF, material: PA12-HP, wall_gate: 1.2, void_gate: 1.2, red_line: 0.5, design_margin: 0.1, wedge_band: 1.5,
            tolerance: 0.3, tolerance_source: "vendor sheet, fetch and date it", max_bbox_for_rule: 147, checker_url: "https://jlc3dp.com/", checker_date: 2026-09-28,
            samples_per_mm2: 10, post_process: none, rating: {ul94: HB, tg_c: 178, source: TDS}, accepted: []}
  home_fdm: {vendor: home, process: FDM, material: PLA, printer: "0.4 nozzle, 0.20 mm", wall_gate: 1.6, rib_gate: 1.2, void_gate: 1.0, red_line: 0.5,
             design_margin: 0.0, wedge_band: 1.5, tolerance: 0.2, samples_per_mm2: 10, post_process: none, rating: {ul94: unrated, tg_c: 55, source: TDS}, accepted: []}
reorg:                                        # the layout of record; `scripts/reorg_paths.py --check` = no old literal, no dangling docs/ path
  moves: {docs/DECISIONS.md: 90-log/DECISIONS.md, docs/STATUS.md: 90-log/STATUS.md, docs/GATES.md: 90-log/GATES.md,
          docs/BLOCKERS.md: 90-log/BLOCKERS.md, docs/KNOWN_ISSUES.md: 90-log/KNOWN_ISSUES.md, docs/TRACEABILITY.md: 90-log/TRACEABILITY.md,
          docs/TEST_PLAN.md: 20-design/TEST_PLAN.md}
  frozen: [30-board/fab/]                          # an uploaded package is a record: never rewritten, never checked
  no_existence: ['.py', '.js', 90-log/DECISIONS.md, 90-log/STATUS.md, 90-log/BLOCKERS.md, 90-log/KNOWN_ISSUES.md, 80-reviews/]   # records cite history (a blocker names the note it could not write); code carries fixture strings
  allow_missing: ['^70-release/rev[0-9]+/']
  rewrites_record: 80-reviews/REORG_REWRITES.txt
assembly_guide:                               # scripts/assembly_guide.py; the smoke's renderer is a stub that writes the camera + defs into the file
  yaml: 20-design/assembly_guide.yaml
  steps_md: out/ASSEMBLY.md
  scad: out/case.scad
  out_dir: 70-release/{REV}
  doc_name: VISUAL_ASSEMBLY_GUIDE.md
  size: '640,480'
  render_cmd: "printf 'PNG-stub %s %s' {CAMERA} {DEFS} > {OUT}"
renders:
  - {name: panel_top, kind: copy, src: "30-board/fab/{REV}/panel_top.png"}
  - {name: case_iso, kind: copy, src: "out/case/{CASE_VERSION}/iso.png", sub: case}
reports:
  - name: PCB_DESIGN_REPORT
    title: smoke PCB design report
    sections: [banner, identity, decisions, known_issues, package, traceability, dfm, renders, inventory]
    extra_sources: [20-design/board.yaml, 20-design/parts.yaml]
  - name: CASE_DESIGN_REPORT
    title: smoke case design report
    sections: [banner, identity, decisions, renders, inventory]
    extra_sources: [20-design/case.yaml]
gates:
  quiet_regex: 'Fontconfig|wxApp'
  adopt:                                      # selftests first, then the pure --check gates; exit 1 on the first failure
    - "$PY scripts/project.py --selftest"
    - "$PY scripts/known_issues.py --selftest"
    - "$PY scripts/traceability.py --selftest"
    - "$PY scripts/dfm_check.py --selftest"
    - "$PY scripts/release_report.py --selftest"
    - "$PY scripts/reorg_paths.py --selftest"
    - "$PY scripts/thin_wall_check.py --selftest"
    - "$PY scripts/assembly_guide.py --selftest"
    - "$PY scripts/gate_check.py --selftest"
    - "$PY scripts/erc_gate.py --selftest"
    - "$PY scripts/step2stl.py --selftest"
    - "$PY scripts/arrival_checklist.py --selftest"
    - "$PY scripts/reorg_paths.py --check"
    - "$PY scripts/assembly_guide.py --check"
    - "$PY scripts/arrival_checklist.py --check"
    - "$PY scripts/known_issues.py --check"
    - "$PY scripts/traceability.py --check"
    - "$PY scripts/dfm_check.py --check"
    - "$PY scripts/collect_renders.py --check"
    - "$PY scripts/release_report.py --check"
    - "true # DRC stand-in: the smoke board is a stub with no CAD; a real project lists its gen/drc_gate.py --check here (project.py gates-required demands a DRC line once paths.board exists)"
  clone:                                      # run on `git archive HEAD` — what a fresh clone sees
    - "$PY scripts/known_issues.py --check"
    - "$PY scripts/release_report.py --check"
  regen:                                      # `clone_gate.sh --regen`: rewrite the reports from HEAD inputs only
    - "$PY scripts/release_report.py"
  regen_copy_back: [70-release/reports/PCB_DESIGN_REPORT.md, 70-release/reports/CASE_DESIGN_REPORT.md]
