# scripts/generic_lint_terms.yaml — the GENERIC patterns the skill repo may not carry (owner rule: the skill describes the METHOD for any
# hardware project, never one project). Read by scripts/generic_lint.py over the WHOLE repo (CHANGELOG.md and docs/ included; only .git,
# .venv, LICENSE and this file are skipped); every entry is a Python regex matched per line, case-sensitive unless it starts with (?i).
# This repo is public. It holds only shapes: id formats, path shapes, a refdes scheme, a fab-code shape. A project, person, company,
# order or part NAME never goes here, because the list would publish what it guards. Those terms live in a private file outside the
# repo: $HWFS_PRIVATE_TERMS, else ~/.config/hw-from-spec/private_terms.yaml, same group shape. The lint merges it when it exists.
# A fenced worked example skips every group EXCEPT the *_names and *_ids groups — a worked example keeps numbers and kinds, never a name:
#   <!-- worked example: begin (2026) -->  …  <!-- worked example: end -->   (at most ONE block per file)
# CHANGELOG.md and docs/ keep their measured numbers and the skill's own review finding ids (design_dimensions, review_ids_as_citations).
# Extend the private file at a retro when a new project's names leak in; never shorten a list to make a hit go away — rewrite the sentence.
project_names:
  - '(?i)\bsource[- ]project'                      # "the source project", "one source project": write the generic statement instead
part_names:                                        # label SHAPES of one design's bodies and joints; the generic kind ("cap", "foot") is fine
  - '\b[A-Z]\d+_m\b'                               # body ids of the T1_m kind
  - '\b[a-z]–[a-z]–T\d\b'                          # a linkage's bar labels (c–k–T1)
  - '\bJ\d–J\d\b'                                  # joint labels
project_ids:                                       # order / account / quote id shapes
  - '\b[WD]20\d{6,}\b'                             # vendor order ids W2026…, D2026…
  - '\bSMT\d{10,}\b'
  - '\bW\d{14,}\b'
machine_paths:
  - '/Users/'
  - '/home/[a-z]'
  - '/private/tmp/'
  - '(?i)\b[A-Z]:\\Users\\'
parts_and_refdes:
  - '\b(J|U|R|C|D|SW|TP|Q|L|H)\d{3}\b'            # a sheet x 100 + n refdes scheme
  - '\bC\d{5,8}\b'                                 # LCSC codes; a fab code belongs in parts.yaml, never in a rule
record_ids_as_citations:                           # a project's decision / change / blocker ids cited in prose
  - '\bCC-(?!001\b)\d{3}\b'                      # CC-001 / D-01 are the template's own seed rows (the process row, the spec row)
  - '\bD-(?!01\b)\d{2}[a-z]?\b'
  - '\bCC-\d{3}\.\d\b'
review_ids_as_citations:                           # finding ids of a review; CHANGELOG.md and docs/ cite the skill's own reviews by them
  - '\bR1-\d+\b'
  - '\bR-C\d+\b'
  - '\bB-\d{2}\b'
  - '\bFA-\d+\b'
  - '\bOPUS_'
